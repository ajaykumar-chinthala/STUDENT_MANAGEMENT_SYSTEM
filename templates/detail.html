<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            width: 700px;
            height: 400px;
            /* border: 1px solid grey; */
            border-radius: 15px;
            background-color: white;
            box-shadow: 3px 3px 2px rgb(185, 184, 184);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }
    </style>
</head>
<body style="display: flex;flex-direction: column;align-items: center;justify-content: center;">
    <div class="cont">
         <p>Name   : {{std["name"]}}</p>
         <p>Age    : {{std["age"]}}</p>
         <p>Gender : {{std["gender"]}}</p>
         <p>Marks  : {{std["marks"]}}</p>
         <p>Course : {{std["course"]}}</p>
         <p>Image  : {{std["image"]}}</p>
         {% if std["status"] %}
         <p>Status : PRESENT</p>
         {%else%}
         <p>Status :  ABSENT</p>
         {%endif%}
    </div>
</body>
</html>
